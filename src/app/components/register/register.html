<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-4">
      <div class="card">
        <div class="card-body">
          <h3 class="card-title text-center mb-4">Register</h3>
          <div class="mb-3">
            <input type="text" class="form-control" placeholder="Username" [(ngModel)]="credentials.userName" />
          </div>
          <div class="mb-3">
            <input type="password" class="form-control" placeholder="Password" [(ngModel)]="credentials.password" />
          </div>
          @if (errorMessage) {
            <div class="alert alert-danger">{{ errorMessage }}</div>
          }
          <button class="btn btn-primary w-100" (click)="register()">Register</button>
          <p class="text-center mt-3">
            Har du redan ett konto? <a routerLink="/login">Logga in</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
